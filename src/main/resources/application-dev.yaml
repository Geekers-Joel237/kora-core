# Local development — the default profile (spring.profiles.default in the base file).
# Overrides only what differs from the base contract.

spring:
  # Press Run in the IDE and the stack comes up on its own — no terminal, no
  # `docker compose up -d` to remember. Enabled here and nowhere else.
  #
  # Three things had to be true for this to be safe. All three are verified,
  # none is assumed (ADR-006 D7):
  #
  #   1. BOTH files must be named. The integration resolves a single Compose
  #      file by default and then runs `docker compose -f <that file>`, which
  #      suppresses the automatic pickup of docker-compose.override.yml. The
  #      ports live there, so it failed with "No host port mapping found for
  #      container port 5432". spring.docker.compose.file is a List<File> in
  #      4.0.3, so both are passed and the invocation matches what a developer
  #      types by hand.
  #   2. Postgres must not be auto-wired. Its ConnectionDetails outrank
  #      spring.datasource.*, and they are built from the container's
  #      `environment:` block — the superuser. The org.springframework.boot.ignore
  #      label on the service in docker-compose.override.yml disables that while
  #      leaving the lifecycle intact.
  #   3. Profiles must keep a single source of truth. This block deliberately
  #      does NOT set spring.docker.compose.profiles.active: the `docker compose`
  #      subprocess inherits the working directory and reads the same .env, so
  #      COMPOSE_PROFILES governs here exactly as it does in a terminal.
  #
  # start-only, not the start-and-stop default: stopping the application must not
  # stop the database. It matches `restart: "no"` — the stack goes up and down
  # because you decided so, not as a side effect of a run configuration.
  docker:
    compose:
      enabled: true
      file:
        - docker-compose.yml
        - docker-compose.override.yml
      lifecycle-management: start-only

  # MailDev, started by docker-compose. It accepts anything and stores it in RAM,
  # so no credentials and no TLS. A deployed environment must not inherit this.
  mail:
    from: noreply@kora.dev
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Provider stub: fast and deterministic, so a local run is not spent waiting.
# Realistic latencies belong to the perf profile.
kora:
  provider:
    behavior: SUCCESS
    simulate-latency: true
    latency:
      authorize-ms: 200
      capture-ms: 150
      timeout-threshold-ms: 3000

# Monitoring: wide open, because this runs on your machine and the whole point
# is to see why something is DOWN. show-details puts the datasource URL and the
# SMTP host in the /actuator/health payload, and env/configprops expose the
# resolved configuration — useful here, unacceptable anywhere reachable.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
    health:
      show-details: always
