# ─────────────────────────────────────────────────────────────────────────────
# Base configuration.
#
# Two kinds of entry are allowed here, and nothing else:
#
#   1. The environment contract — which variables must exist for the application
#      to run at all. The binding text is identical everywhere; only the injected
#      values differ, and they come from .env.
#   2. Policy that is genuinely the same in every environment.
#
# Anything an environment could legitimately want to change — monitoring, mail
# transport, provider behavior, connection pool sizing — belongs in
# application-<profile>.yaml. Putting it here would force every environment to
# inherit a decision that was only ever made for one of them.
#
# No entry below carries a default. A missing variable must stop the boot: a
# silent fallback on a signing key or a database credential is a security
# defect, not a convenience. The values come from .env, which the block below
# imports, so `./gradlew bootRun` works with no shell preparation.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  # The application reads .env itself from the working directory, so it and
  # Docker Compose consume the same file with no shell ceremony in between.
  # Real environment variables still win — SPRING_PROFILES_ACTIVE=perf and a
  # CI-injected secret both override what .env says.
  #
  # optional: so a deployment that injects plain environment variables — a
  # container, a CI job — is not forced to carry a file it does not need.
  #
  # Known limit: with no .env and no exported variable, an unresolved
  # ${POSTGRES_APP_PASSWORD} is bound as literal text and surfaces as
  # "password authentication failed" rather than "variable missing". Only the
  # JWT key is protected from that, by the @Size constraint on
  # SecurityProperties. Closing it for the datasource needs an
  # EnvironmentPostProcessor that rejects any resolved value still containing
  # "${" — not done.
  config:
    import: "optional:file:./.env[.properties]"

  # Off by default, on in the dev profile only. Starting containers is a
  # developer-machine convenience: a server has already started them, and a perf
  # run starts them from perf/*-run.sh. Enabling it here would make every
  # environment inherit a decision taken for one of them.
  #
  # application-dev.yaml turns it on, and does the two things that make it safe:
  # it names BOTH Compose files, and the dev postgres service carries the
  # org.springframework.boot.ignore label. See ADR-006 D7 for why each is needed.
  docker:
    compose:
      enabled: false

  application:
    name: kora-core
  profiles:
    default: dev

  # Two roles, two jobs. The application never needs DDL rights, and the
  # migration runner never serves traffic. Splitting them means a SQL injection
  # that reaches the connection pool still cannot DROP a table.
  #
  # Until KC-05 creates the roles in PostgreSQL, both pairs point at the same
  # superuser in .env and behaviour is unchanged. KC-05 then creates
  # kora_migration (owner, DDL) and kora_app (DML only, no CREATE/DROP) and
  # updates .env — no file here changes.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_APP_USER}
    password: ${POSTGRES_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_SMTP_PORT}

  # Flyway owns the schema in every environment; Hibernate only checks that the
  # entities match it and never emits DDL. Out-of-order stays off everywhere:
  # a migration older than the highest applied one is re-stamped before merge,
  # never inserted retroactively. See CONTRIBUTING.md section 9.
  jpa:
    hibernate:
      ddl-auto: validate

    # Off, against the Spring Boot default. OSIV keeps the EntityManager bound to
    # the request until the response is rendered, so a lazy association touched
    # during serialization loads outside any transaction — a query that none of
    # the TX-1 / TX-2 accounting in ADR-004 sees. With it off, that same access
    # raises LazyInitializationException instead of quietly issuing SQL.
    # It does not pin a JDBC connection either way: this is a resource-local
    # setup, so Hibernate returns the connection to Hikari at each commit.
    open-in-view: false
  flyway:
    # No url: Spring derives it from spring.datasource.url and only swaps the
    # credentials, so the two roles cannot drift onto different databases.
    user: ${POSTGRES_MIGRATION_USER}
    password: ${POSTGRES_MIGRATION_PASSWORD}
    out-of-order: false

server:
  port: ${SERVER_PORT}

management:
  influx:
    metrics:
      export:
        # micrometer-registry-influx is an unconditional dependency, and the
        # exporter's own default is enabled=true — so without this line it runs
        # in every profile, hunting for localhost:8086 and logging two stack
        # traces a minute wherever InfluxDB is not up. Only the perf profile,
        # which starts the container, turns it back on.
        enabled: false

# Token and OTP lifetimes are product policy, not environment tuning: the same
# numbers hold on a laptop and under load. A profile may still override them.
kora:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
    otp:
      expiration-minutes: 5
