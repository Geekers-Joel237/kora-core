# ──────────────────────────────────────────────────────────────────────────────
# Profil "perf" — configuration pour les tests de charge k6
# Activer : SPRING_PROFILES_ACTIVE=perf ./gradlew bootRun
# ──────────────────────────────────────────────────────────────────────────────

# ── Actuator ──────────────────────────────────────────────────────────────────
# Exposer les endpoints nécessaires à Grafana et au monitoring de charge
management.endpoints.web.exposure.include=health,metrics,prometheus,info

# ── Micrometer → InfluxDB ─────────────────────────────────────────────────────
# Exporte les métriques applicatives vers la même instance InfluxDB que k6.
# Base de données séparée (kora_metrics) pour ne pas mélanger avec les métriques k6.
management.influx.metrics.export.enabled=true
management.influx.metrics.export.uri=http://localhost:8086
management.influx.metrics.export.db=kora_metrics
management.influx.metrics.export.step=10s
management.influx.metrics.export.auto-create-db=true

# ── Métriques critiques à activer ────────────────────────────────────────────
# HikariCP — surveillance du pool de connexions DB
management.metrics.enable.hikaricp=true
# JVM — surveillance de la mémoire heap
management.metrics.enable.jvm=true
# HTTP server — latence applicative (complète les métriques k6)
management.metrics.enable.http.server.requests=true

# ── Tags communs ──────────────────────────────────────────────────────────────
# Permet de filtrer par application dans InfluxDB / Grafana
management.metrics.tags.application=kora-core
management.metrics.tags.env=perf

# ── HikariCP — paramètres de pool pour les tests de charge ───────────────────
# Pool dimensionné pour ~60 req/sec (stress test max)
# Règle empirique : pool_size ≈ (nb_cores × 2) + 1 → 10 pour 4 cores
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# ── Logging ───────────────────────────────────────────────────────────────────
# Réduire le logging en perf pour ne pas biaiser les mesures
logging.level.root=WARN
logging.level.com.geekersjoel237.koracore=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN