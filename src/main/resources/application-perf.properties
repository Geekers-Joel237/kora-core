# Realistic African mobile-money network latencies for k6 load testing.
# Activate with: SPRING_PROFILES_ACTIVE=perf ./gradlew bootRun
kora.provider.behavior=SUCCESS
kora.provider.simulate-latency=true
kora.provider.latency.authorize-ms=800
kora.provider.latency.capture-ms=600
kora.provider.latency.timeout-threshold-ms=5000

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=30
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Micrometer → InfluxDB (kora_metrics DB, same container as k6 sink).
# Enables JVM heap, HikariCP, and HTTP server panels in Grafana.
management.influx.metrics.export.enabled=true
management.influx.metrics.export.uri=http://localhost:8086
management.influx.metrics.export.db=kora_metrics
management.influx.metrics.export.step=10s