spring.application.name=kora-core
server.port=8081
spring.jpa.hibernate.ddl-auto=update

# Mail — local dev: MailDev (docker-compose maildev service)
# UI: http://localhost:1080   SMTP: localhost:1025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.from=noreply@kora.local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Security Configuration (JWT & OTP)
kora.security.jwt.secret=${JWT_SECRET:kora-core-default-secret-key-must-be-32-chars!}
kora.security.jwt.access-token-expiration-minutes=15
kora.security.jwt.refresh-token-expiration-days=7
kora.security.otp.expiration-minutes=5

# Provider simulation (override in application-perf.properties for realistic latencies)
kora.provider.behavior=SUCCESS
kora.provider.simulate-latency=true
kora.provider.latency.authorize-ms=200
kora.provider.latency.capture-ms=150
kora.provider.latency.timeout-threshold-ms=3000

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:kora-db}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver