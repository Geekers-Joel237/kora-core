spring.application.name=kora-core-test

# Flyway creates the schema on the Testcontainer DB — same SQL as production
# ddl-auto=none: Hibernate never touches DDL, Flyway is the single owner
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Security Configuration (Test values)
kora.security.jwt.secret=kora-core-test-secret-key-must-be-at-least-32-chars!
kora.security.jwt.access-token-expiration-minutes=15
kora.security.jwt.refresh-token-expiration-days=7
kora.security.otp.expiration-minutes=5

# Suppress Spring Boot banner in tests
spring.main.banner-mode=off

# Provider simulation — no latency in tests
kora.provider.behavior=SUCCESS
kora.provider.simulate-latency=false