services:

  postgres:
    image: 'postgres:17.7-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    # $$ escapes Compose's own substitution, so the shell inside the container
    # expands these against the container's environment. A single $ would make
    # Compose resolve them on the host and bake the values into the command.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Failures inside this window do not count against `retries`: initdb on a
      # first boot takes far longer than a normal restart.
      start_period: 40s
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
      # Runs on a fresh volume only. On an existing one, run it by hand:
      #   docker compose exec postgres sh /docker-entrypoint-initdb.d/10-kora-roles.sh
      - './docker/postgres/initdb:/docker-entrypoint-initdb.d:ro'
    networks: [ kora ]

volumes:
  postgres-data:

networks:
  kora:
    # Fixed name instead of the default <project>_kora. The k6 container joins
    # this network by name from perf/*-run.sh; deriving it from the directory
    # name would break the moment the repository is cloned elsewhere.
    name: kora-net
    driver: bridge
